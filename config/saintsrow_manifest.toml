# analysis does not discover. Without these, calls to them return 0.
0x826044F8 = { name = "sub_826044F8", size = 8 }
0x82609D68 = { name = "sub_82609D68", size = 8 }
0x82609D80 = { name = "sub_82609D80", size = 8 }
