# Saints Row (Xbox 360, 2006) - ReXGlue codegen manifest.
# Paths are relative to this file. setup.ps1 extracts the ISO to dist/game.

[project]
sdk_version = "0.10.0"
name = "saintsrow"

[entrypoint]
file_path = "../dist/game/default.xex"
out_directory_path = "../build/generated"
includes = []

# ABI register save/restore helpers
savegprlr_14_address = 0x82702850
restgprlr_14_address = 0x827028A0
savefpr_14_address = 0x82702F10
restfpr_14_address = 0x82702F5C
savevmx_14_address = 0x8275B150
restvmx_14_address = 0x8275B3E8
savevmx_64_address = 0x8275B1E4
restvmx_64_address = 0x8275B47C

[entrypoint.functions]
# Unresolved branch targets
0x82608CC0 = { name = "sub_82608CC0" }
0x826090D8 = { name = "sub_826090D8" }
