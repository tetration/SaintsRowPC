name = "SrSkipNullVoiceDispatch"
registers = ["r28"]
jump_address_on_true = 0x821061D8

[[entrypoint.midasm_hook]]
address = 0x8265F50C
name = "SrClampByteR10"
registers = ["r10"]
after_instruction = true

[[entrypoint.midasm_hook]]
address = 0x8265F554
name = "SrClampByteR7"
