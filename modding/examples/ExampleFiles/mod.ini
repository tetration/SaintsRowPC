[mod]
name = Example: file replacement
author = whompay
version = 1.0
description = A template for mods that replace game files.\n\nEverything in this mod's "files" folder replaces the file at the same path in the game folder (dist\game). For example, files\data\something.xtbl would replace game\data\something.xtbl.\n\nThis example only contains a readme, so it changes nothing in game.
