[mod]
name = 60 FPS
author = whompay
version = 1.0
description = Lets the game run at 60 frames per second instead of its normal 30.\n\nPort of the community "Unlock FPS" patch for the Xbox 360 version (by illusion and Tervel). Known side effects at high frame rates on the original game: some objects in cutscenes can drift out of sync and doors can jump when opened.
