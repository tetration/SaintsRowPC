[mod]
name = Living Stilwater
author = whompay
version = 1.1
description = Makes Stilwater feel alive: more people on the streets, more traffic, and random street encounters (gang fights, muggings, drunks, street performers and more) happen far more often.\n\nThe boost follows how busy a place already is: the city streets by day get the full amount, while nights, the airport, the docks, industrial areas and the suburbs get only a little more than normal. Missions that thin out the streets still do.\n\nChange the numbers under [settings] in this mod's mod.ini to tune it (1.0 = the game's normal amount). Restart the game after changing them.

[settings]
; Pedestrian multiplier for the busiest places and times.
pedestrians = 2.5
; Traffic multiplier for the busiest places and times.
traffic = 2.5
; How much more the boost favours busy places over quiet ones (0 = same boost everywhere).
busy_bias = 1.5
; Share of the boost the airport, docks, industrial areas and suburbs get (0 = none, 1 = full).
outskirts = 0.35
; Most traffic cars around you at once (the game normally keeps up to 12).
max_traffic_cars = 28
; Most pedestrians around you at once (the game normally keeps up to 26).
max_people = 60
; Most cars of the same model in traffic at once (the game normally allows 3).
same_model_limit = 8
; How far away traffic is placed (1.0 = normal). Higher means fewer cars popping in close to you.
traffic_distance = 1.5
; Multiplier for the chance of random street encounters happening.
encounters = 2.5
; Write spawn numbers to mods/wml.log every few seconds.
debug = false
