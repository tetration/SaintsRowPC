[mod]
name = Wanted and Turf
author = tetration
version = 0.1
description = F6 opens a menu that controls heat and turf. Pick a faction (Police, West Side Rollerz, Los Carnales, Vice Kings), choose 0-5 stars and apply it, or lock a faction at that number so it never rises or falls - locking at 0 stars means that faction never wants you at all. One key clears every wanted level again. The menu also names the turf you are standing in and hands it to the Third Street Saints, Los Carnales, Vice Kings, West Side Rollerz or nobody; the ambient spawn system reads turf ownership live, so the gang that hangs around there changes with it.\n\nSingle-player only. Wanted levels and turf ownership are part of the save.
