[mod]
name = Whompays Trainer
author = whompay
version = 0.2
description = F4 toggles a white-text menu over the game. Press 1 for Max Reputation, 2 for All Guns, 3 for $100,000, or 4 for God Mode. No mouse needed.\n\nUse during single-player gameplay. Money, respect and weapons can be saved with your game. God Mode starts off each run. Guns use normal weapon-slot rules. Requires the text-overlay loader update.
